services:
  photoblog:
    image: python:3.12-slim
    working_dir: /app
    command: >
      bash -c "pip install --quiet --upgrade pip &&
               pip install --quiet -r requirements.txt &&
               uvicorn app.main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app
