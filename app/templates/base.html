<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ config.site_name }}{% endblock %}</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0d0d0d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="{{ config.site_name }}">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d0d0d;
      --text: #e8e8e8;
      --muted: #666;
      --gap: 4px;
    }
    body {
      background: var(--bg);
      color: var(--text);
      /* font-family: "Roboto", sans-serif; */
      font-weight: 300;
      min-height: 100vh;
      opacity: 0;
      transition: opacity 1.2s ease;
    }
    nav {
      padding: 24px 32px;
    }
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    nav a {
      color: var(--text);
      text-decoration: none;
      letter-spacing: 3px;
      font-size: 13px;
      text-transform: uppercase;
    }
    nav .nav-instagram {
      font-size: 12px;
      letter-spacing: 1px;
      color: var(--muted);
    }
    nav .nav-instagram:hover { color: var(--text); }
    main {
      padding: 0 32px 64px;
      max-width: 1400px;
      margin: 0 auto;
    }
    a { color: inherit; text-decoration: none; }
    {% block extra_styles %}{% endblock %}
  </style>
</head>
<body>
  <nav>
    <a href="/gallery">{{ config.site_name }}</a>
    {% if config.instagram_url %}
    <a href="{{ config.instagram_url }}" class="nav-instagram" target="_blank" rel="noopener">@{{ config.instagram_url.split('/')[-1] }}</a>
    {% endif %}
  </nav>
  <main>{% block content %}{% endblock %}</main>
  {% block scripts %}{% endblock %}
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/static/sw.js');
    }
    document.addEventListener('DOMContentLoaded', function() {
      document.body.style.opacity = '1';
    });
  </script>
</body>
</html>
